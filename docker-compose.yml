services:
  go-server:
    image: golang:1.23-alpine
    container_name: go-server
    command: sh -c "go run /app/main.go"
    volumes:
      - ./go-server:/app
    ports:
      - "8081:8080"
    cpus: "1.0"
    mem_limit: 4g

  php-server:
    image: php:8.3-cli
    container_name: php-server
    command: sh -c "php -S 0.0.0.0:8080 -t /app"
    volumes:
      - ./php-server:/app
    ports:
      - "8082:8080"
    cpus: "1.0"
    mem_limit: 4g

  java-server:
    image: openjdk:21-jdk-slim
    container_name: java-server
    command: sh -c "javac /app/Main.java && java -cp /app Main"
    volumes:
      - ./java-server:/app
    ports:
      - "8083:8080"
    cpus: "1.0"
    mem_limit: 4g
